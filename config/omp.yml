modelRoles:
  designer: anthropic/claude-fable-5-1:high
  smol: omniroute/mimo-v2.5-pro:low
  slow: anthropic/claude-opus-5:xhigh
  vision: omniroute/sonnet-5:high
  plan: anthropic/claude-fable-5-1:xhigh
  commit: omniroute/mimo-v2.5-pro:low
  tiny: omniroute/mimo-v2.5-pro:low
  advisor: omniroute/sonnet-5:high
  Kimi: kimi-code/k3
  task: anthropic/claude-opus-5:xhigh
  subagent: anthropic/claude-opus-5:xhigh
  default: anthropic/claude-opus-5:xhigh
theme:
  dark: dark-rose-pine
symbolPreset: nerd
defaultThinkingLevel: auto
hideThinkingBlock: false
autocompleteMaxVisible: 10
steeringMode: one-at-a-time
interruptMode: immediate
includeModelInPrompt: false
readLineNumbers: true
omitThinking: true
textVerbosity: low
cycleOrder:
- smol
- default
- slow
- subagent
colorBlindMode: false
statusLine:
  preset: custom
  compactThinkingLevel: true
  leftSegments:
  - path
  - git
  - model
  - mode
  rightSegments:
  - context_pct
  - token_rate
  - subagents
  - cost
  - time_spent
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
  showHookStatus: true
  sessionAccent: false
  separator: powerline
  transparent: true
composer:
  shape: borderless
mnemopi:
  noEmbeddings: true
