# Every role resolves to an OmniRoute option generated by
# scripts/sync_omniroute_models.py: a combo named after one exact model (it
# pools that model across every provider serving it), or a direct provider id
# when the model lives on a single provider. Avoid omniroute/auto/claude-opus
# and friends: those are routing-variant aliases that serve whatever model
# scores best, not the named model.
modelRoles:
  designer: omniroute/cc/claude-fable-5:high
  smol: omniroute/mimo-v2.5-pro:low
  slow: omniroute/opus-5:xhigh
  vision: omniroute/sonnet-5:high
  plan: omniroute/cc/claude-fable-5:xhigh
  commit: omniroute/mimo-v2.5-pro:low
  tiny: omniroute/mimo-v2.5-pro:low
  advisor: omniroute/sonnet-5:high
  Kimi: kimi-code/k3
  task: omniroute/opus-5:xhigh
  subagent: omniroute/opus-5:xhigh
  default: omniroute/opus-5:xhigh
theme:
  dark: dark-rose-pine
symbolPreset: nerd
defaultThinkingLevel: auto
hideThinkingBlock: false
autocompleteMaxVisible: 10
steeringMode: one-at-a-time
interruptMode: immediate
includeModelInPrompt: false
readLineNumbers: true
omitThinking: true
textVerbosity: low
cycleOrder:
- smol
- default
- slow
- subagent
colorBlindMode: false
statusLine:
  preset: custom
  compactThinkingLevel: true
  leftSegments:
  - path
  - git
  - model
  - mode
  rightSegments:
  - context_pct
  - token_rate
  - subagents
  - cost
  - time_spent
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
  showHookStatus: true
  sessionAccent: false
  separator: powerline
  transparent: true
composer:
  shape: borderless
# Mnemopi memory: FTS-only recall. The local embedding model (bge-base via
# onnxruntime) costs ~1 GB per omp session; ten fleet lanes = 10 GB of swap on
# the source host (2026-09-17). Applies only when memory.backend is mnemopi.
mnemopi:
  noEmbeddings: true
