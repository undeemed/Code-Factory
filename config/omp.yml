# Every role resolves to an OmniRoute option generated by
# scripts/sync_omniroute_models.py. Claude goes through DIRECT provider ids
# (omniroute/cc/...), never a combo: a combo wraps the stream in its own
# quality validation and dies with `502 quality validation — streaming upstream
# error` at real agent payload size. Both Claude Max accounts live under the
# `cc` provider, so a direct id still pools them. Fable is 5.1; Fable 5 is
# hidden. Never use omniroute/auto/claude-opus — that is a routing-variant
# alias that serves whatever scores best, not Opus.
modelRoles:
  designer: omniroute/cc/claude-fable-5-1:high
  smol: omniroute/mimo-v2.5-pro:low
  slow: omniroute/cc/claude-opus-5:xhigh
  vision: omniroute/sonnet-5:high
  plan: omniroute/cc/claude-fable-5-1:xhigh
  commit: omniroute/mimo-v2.5-pro:low
  tiny: omniroute/mimo-v2.5-pro:low
  advisor: omniroute/sonnet-5:high
  Kimi: kimi-code/k3
  task: omniroute/cc/claude-opus-5:xhigh
  subagent: omniroute/cc/claude-opus-5:xhigh
  default: omniroute/cc/claude-opus-5:xhigh
theme:
  dark: dark-rose-pine
symbolPreset: nerd
defaultThinkingLevel: auto
hideThinkingBlock: false
autocompleteMaxVisible: 10
steeringMode: one-at-a-time
interruptMode: immediate
includeModelInPrompt: false
readLineNumbers: true
omitThinking: true
textVerbosity: low
cycleOrder:
- smol
- default
- slow
- subagent
colorBlindMode: false
statusLine:
  preset: custom
  compactThinkingLevel: true
  leftSegments:
  - path
  - git
  - model
  - mode
  rightSegments:
  - context_pct
  - token_rate
  - subagents
  - cost
  - time_spent
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
  showHookStatus: true
  sessionAccent: false
  separator: powerline
  transparent: true
composer:
  shape: borderless
# Mnemopi memory: FTS-only recall. The local embedding model (bge-base via
# onnxruntime) costs ~1 GB per omp session; ten fleet lanes = 10 GB of swap on
# the source host (2026-09-17). Applies only when memory.backend is mnemopi.
mnemopi:
  noEmbeddings: true
