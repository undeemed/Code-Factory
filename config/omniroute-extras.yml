# Direct OmniRoute provider ids exposed in omp alongside the combos.
#
# A combo exists to pool one model across several providers. When a model lives
# on a single provider, the router already rotates that provider's connections
# (both Claude Max accounts, for example), so the plain id is equivalent — and
# for Claude Fable 5 it is strictly better: the combo path returns
# `502 quality validation — streaming upstream error` on streaming requests,
# which every omp turn is, while the direct id streams reliably (4/4 verified
# 2026-09-17). See docs/omniroute-models.md.
models:
  # Orphan panes (anything that is not a Firstmate crew or secondmate lane) run
  # on coding-weighted auto routing rather than a pinned model, per the captain
  # 2026-09-17. `auto/best-coding` scores every connected provider, free tier
  # included; `auto/coding:pro` restricts the pool to premium models.
  - id: auto/best-coding
    name: Best coding (auto-routed across every provider)
  - id: auto/coding:pro
    name: Best coding, premium pool only
  - id: cc/claude-fable-5
    name: Claude Fable 5 (all Claude accounts)
