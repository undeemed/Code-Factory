---
# Agent harness preferences.
#
# These are sanitized preference files, not credential stores. They are written
# once: an account that already has provider settings or an authenticated
# harness keeps them (contract: "first-time writes only for OMP/Pi"). The
# harness binaries themselves come from the installer's --npm set, which also
# carries the pinned gh / no-mistakes / treehouse support binaries.

- name: Ensure the harness preference directories
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
    owner: "{{ factory_cfg.user }}"
    group: "{{ factory_group }}"
    mode: "{{ item.dir_mode }}"
  become: true
  loop: "{{ factory_agent_config_files }}"
  loop_control:
    label: "{{ item.dest | dirname }}"

- name: Check for existing harness preference files
  ansible.builtin.stat:
    path: "{{ item.dest }}"
    get_checksum: false
  become: true
  loop: "{{ factory_agent_config_files }}"
  loop_control:
    label: "{{ item.dest }}"
  register: factory_agent_config_stat
  changed_when: false
  check_mode: false

- name: Write harness preferences that are absent
  ansible.builtin.copy:
    src: "{{ code_factory_repo }}/{{ item.item.src }}"
    dest: "{{ item.item.dest }}"
    owner: "{{ factory_cfg.user }}"
    group: "{{ factory_group }}"
    mode: "{{ item.item.mode }}"
    remote_src: true
  become: true
  loop: "{{ factory_agent_config_stat.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when:
    - item.item.first_write | bool
    - not (item.stat.exists | default(false))

- name: Report harness preferences left untouched
  ansible.builtin.debug:
    msg: >-
      {{ factory_agent_config_stat.results
         | selectattr('stat.exists', 'defined')
         | selectattr('stat.exists')
         | map(attribute='item.dest') | list | join(', ') | default('none', true) }}
      already exist and were not rewritten (first-write-only inputs).

# The model list is generated, never copied: OmniRoute combos are the only
# selectable options and they change whenever an account or family is added.
# Unreachable router (fresh host, tunnel down) is not a provisioning failure -
# the account keeps whatever list it had and the next run fills it in.
- name: Sync omp's OmniRoute model list from the router
  ansible.builtin.command:
    argv:
      - python3
      - "{{ factory_omniroute_sync_script }}"
      - --no-probe
      - --efforts-cache
      - "{{ factory_omniroute_efforts_cache }}"
      - --models-yml
      - "{{ factory_omniroute_models_yml }}"
  become: true
  become_user: "{{ factory_cfg.user }}"
  register: factory_omniroute_sync
  changed_when: "'wrote' in (factory_omniroute_sync.stderr | default(''))"
  failed_when: false

- name: Report the OmniRoute model sync outcome
  ansible.builtin.debug:
    msg: >-
      {{ (factory_omniroute_sync.stderr_lines | default([]) | last)
         | default('omniroute sync produced no output', true) }}
